<app-header *ngIf="showNavbarAndFooter()"></app-header>
<main [class]="showNavbarAndFooter() ? 'min-h-[85vh]' : ''">
  <router-outlet></router-outlet>
</main>
<app-footer *ngIf="showNavbarAndFooter()"></app-footer>

<button
  type="button"
  (click)="toggleAccessibilityPanel()"
  class="accessibility-fab"
  [attr.aria-expanded]="accessibilityPanelOpen"
  aria-controls="accessibility-panel"
  aria-label="Abrir opciones de accesibilidad"
>
  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4a2 2 0 110 4 2 2 0 010-4zm0 6c-2.21 0-4 1.79-4 4 0 1.38.69 2.59 1.74 3.32L8 20h2l1.2-2.4a2 2 0 011.8-1.1h.2a2 2 0 011.8 1.1L16 20h2l-1.74-2.68A3.96 3.96 0 0016 14c0-2.21-1.79-4-4-4z" />
  </svg>
  <span class="accessibility-fab-text">Accesibilidad</span>
</button>

<div *ngIf="accessibilityPanelOpen" class="accessibility-backdrop" (click)="closeAccessibilityPanel()" aria-hidden="true"></div>

<section
  *ngIf="accessibilityPanelOpen"
  id="accessibility-panel"
  role="dialog"
  aria-labelledby="accessibility-title"
  aria-describedby="accessibility-description"
  class="accessibility-panel"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.25em] text-reasons-green">Accesibilidad</p>
      <h2 id="accessibility-title" class="mt-1 text-lg font-semibold text-slate-900">Ajustes de visualización</h2>
      <p id="accessibility-description" class="mt-1 text-sm text-slate-600">Activa contraste alto, cambia el tamaño del texto y restablece la vista en cualquier momento.</p>
    </div>
    <button type="button" class="accessibility-icon-button" (click)="closeAccessibilityPanel()" aria-label="Cerrar panel de accesibilidad">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="mt-5 space-y-3">
    <button type="button" class="accessibility-option" (click)="toggleHighContrast()" [attr.aria-pressed]="highContrastEnabled">
      <span>
        <strong>Alto contraste</strong>
        <small>{{ highContrastEnabled ? 'Activado' : 'Desactivado' }}</small>
      </span>
      <span class="accessibility-pill" [class.is-active]="highContrastEnabled">{{ highContrastEnabled ? 'ON' : 'OFF' }}</span>
    </button>

    <div class="accessibility-option accessibility-option--stacked" aria-label="Tamaño de letra">
      <div class="flex items-center justify-between gap-3">
        <span>
          <strong>Tamaño de letra</strong>
          <small>{{ fontSizeLabel }}</small>
        </span>
        <span class="accessibility-pill">{{ fontScale.toFixed(1) }}x</span>
      </div>

      <div class="accessibility-font-actions">
        <button type="button" class="accessibility-mini-button" (click)="decreaseFontSize()" [disabled]="fontScale === 1">A-</button>
        <button type="button" class="accessibility-mini-button" (click)="resetAccessibilityPreferences()">Restablecer</button>
        <button type="button" class="accessibility-mini-button" (click)="increaseFontSize()" [disabled]="fontScale === 1.3">A+</button>
      </div>
    </div>
  </div>
</section>
